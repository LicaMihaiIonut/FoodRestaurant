<form [formGroup]="form" class="my-container" (ngSubmit)="submit()">
  <div style="width: 40%">
    <div
      style="
        width: 100%;
        border-bottom: 3px solid #f5f5f0;
        padding: 0.4rem;
        font-size: 1.4rem;
        margin-bottom: 1.5rem;
      "
    >
      Fill your restaurant information
    </div>
    <div>
      <mat-form-field>
        <mat-label>Name</mat-label>
        <input
          matInput
          type="text"
          formControlName="name"
          placeholder="Your restaurant name"
        />
      </mat-form-field>
    </div>

    <div>
      <mat-form-field>
        <mat-label>Transport (LEI)</mat-label>
        <input
          matInput
          type="text"
          formControlName="transport"
          placeholder="E.g. 8"
        />
      </mat-form-field>
    </div>

    <div>
      <mat-form-field>
        <mat-label>Delivery (MINUTES)</mat-label>
        <input
          matInput
          type="text"
          formControlName="delivery"
          placeholder="E.g. 40-45"
        />
      </mat-form-field>
    </div>

    <div
      style="margin: 1rem 0rem; display: flex; color: #d9bc6c"
      *ngIf="!profile.isValidated"
    >
      <i
        class="bi bi-exclamation-circle"
        style="font-size: 20px; margin-right: 1rem"
      ></i>
      Your restaurant is visible to customers when all information is set up.
    </div>

    <button
      type="submit"
      class="base-save-button"
      style="margin-top: 1rem"
      mat-button
    >
      Save
    </button>
  </div>

  <div
    class="profile-image"
    (click)="fileUpload.click()"
    *ngIf="!form.controls['image'].value"
  >
    <i class="bi bi-cloud-arrow-up-fill profile-image-icon"></i>
    <div class="profile-image-browse-files">Browse files</div>
  </div>

  <div
    style="width: 50%; margin-left: 7%"
    *ngIf="!!form.controls['image'].value"
  >
    <img
      style="width: 100%; height: 50vh"
      [src]="form.controls['image'].value ?? 'assets/default-person-image.jpg'"
    />

    <app-custom-button
      style="margin-top: 1rem; margin-left: 0.7rem"
      [icon]="'bi bi-paperclip'"
      [text]="'Upload'"
      (click)="fileUpload.click()"
    ></app-custom-button>
  </div>
</form>

<input
  type="file"
  [(ngModel)]="rawImage"
  class="file-upload"
  #fileUpload
  hidden
  (change)="selectFile($event)"
/>
