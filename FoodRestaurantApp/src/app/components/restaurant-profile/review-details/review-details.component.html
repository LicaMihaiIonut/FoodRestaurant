<div class="d-flex" mat-dialog-container>
  <h2 mat-dialog-title>Review details</h2>
  <i class="bi bi-x close-button base-button" (click)="close()"></i>
</div>

<div class="line"></div>

<div mat-dialog-content>
  <div class="form-content">
    <div class="d-flex">
      <div class="review-customer">
        {{ data.userName }}
      </div>
      <div>
        <i
          *ngFor="let j of [].constructor(5); let col = index"
          class="bi me-1"
          [class.fill-star]="canFillStar(data.grade, col)"
          [class.bi-star-fill]="canFillStar(data.grade, col)"
          [class.bi-star]="!canFillStar(data.grade, col)"
        ></i>
      </div>
    </div>
    <div class="review-description">{{ data.description }}</div>
  </div>
</div>

<div mat-dialog-actions>
  <button class="base-save-button" (click)="close()">Close</button>
</div>
