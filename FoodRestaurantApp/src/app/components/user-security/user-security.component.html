<div class="container">
  <div class="card-info">
    You don't have to change your password now, but changing it frequently will
    make your account more secure.
  </div>

  <div class="container-password">
    <form [formGroup]="form" (ngSubmit)="updatePassword()">
      <div class="password-field">
        <span> Fill your current password</span>
        <mat-form-field>
          <input matInput formControlName="currentPassword" type="password" />
          <mat-error
            *ngIf="form.controls['currentPassword'].hasError('required')"
            >Field is required.</mat-error
          >
        </mat-form-field>
      </div>

      <div class="password-field">
        <span> Introduce new password</span>
        <mat-form-field>
          <input matInput formControlName="newPassword" type="password" />
          <mat-error *ngIf="form.controls['newPassword'].hasError('required')"
            >Field is required.</mat-error
          >
        </mat-form-field>
      </div>

      <div class="password-field">
        <span> Confirm new password</span>
        <mat-form-field>
          <input matInput formControlName="confirmPassword" type="password" />
          <mat-error
            *ngIf="form.controls['confirmPassword'].hasError('required')"
            >Field is required.</mat-error
          >
        </mat-form-field>
      </div>

      <div class="mt-3 mb-3">
        <button class="base-save-button" [class.button-disabled]="isLoading">
          Update password
        </button>
      </div>
    </form>
  </div>
</div>
